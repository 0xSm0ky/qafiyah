name: Feature request
description: Suggest a capability or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: Describe the need, not the implementation. What can't you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: Optional. If you already have an approach in mind, describe it.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Optional.
